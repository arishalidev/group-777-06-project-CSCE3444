<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNT Campus Map — Denton</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --unt-green: #00853E;
    --unt-green-dark: #005C2B;
    --unt-green-light: #E6F5ED;
    --unt-green-mid: #C5E8D4;
    --bg: #F4F3EE;
    --surface: #FFFFFF;
    --surface2: #F7F6F1;
    --border: rgba(0,0,0,0.10);
    --border-strong: rgba(0,0,0,0.18);
    --text: #1A1A18;
    --text-muted: #5E5E58;
    --text-hint: #9A9A92;
    --shadow: 0 2px 12px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08);
    --radius: 10px;
    --radius-sm: 6px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  header {
    background: var(--unt-green-dark);
    color: #fff;
    padding: 0 20px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    z-index: 100;
  }
  .logo-eagle {
    width: 30px; height: 30px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; flex: 1; }
  header span { font-size: 13px; opacity: 0.65; font-family: 'DM Mono', monospace; }

  /* Layout */
  .app-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 300px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-top { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }

  .search-wrap {
    position: relative;
  }
  .search-wrap svg {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    opacity: 0.4; pointer-events: none;
  }
  #search {
    width: 100%; padding: 8px 10px 8px 34px;
    font-family: 'DM Sans', sans-serif; font-size: 14px;
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    background: var(--surface2); color: var(--text); outline: none;
    transition: border-color 0.15s;
  }
  #search:focus { border-color: var(--unt-green); }
  #search::placeholder { color: var(--text-hint); }

  .filter-row {
    display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px;
  }
  .filter-btn {
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
    padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border-strong);
    background: transparent; color: var(--text-muted); cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .filter-btn.active { background: var(--unt-green); color: #fff; border-color: var(--unt-green); }
  .filter-btn:hover:not(.active) { border-color: var(--unt-green); color: var(--unt-green); }

  .building-list {
    flex: 1; overflow-y: auto; padding: 8px 0;
  }
  .building-list::-webkit-scrollbar { width: 4px; }
  .building-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

  .bld-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 16px; cursor: pointer;
    transition: background 0.1s; border-left: 3px solid transparent;
  }
  .bld-item:hover { background: var(--surface2); }
  .bld-item.active { background: var(--unt-green-light); border-left-color: var(--unt-green); }
  .bld-item.hidden { display: none; }

  .bld-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 4px;
  }
  .bld-info h3 { font-size: 13px; font-weight: 600; line-height: 1.3; color: var(--text); }
  .bld-info p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .no-results {
    padding: 32px 16px; text-align: center;
    font-size: 13px; color: var(--text-hint); display: none;
  }

  /* Map canvas */
  .map-wrap {
    flex: 1; position: relative; overflow: hidden; background: #E8EDE6;
  }

  #map-svg {
    width: 100%; height: 100%;
    cursor: grab;
    user-select: none;
  }
  #map-svg:active { cursor: grabbing; }

  /* Map controls */
  .map-controls {
    position: absolute; bottom: 20px; right: 20px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .ctrl-btn {
    width: 36px; height: 36px; border-radius: var(--radius-sm);
    background: var(--surface); border: 1px solid var(--border-strong);
    font-size: 18px; font-weight: 500; color: var(--text-muted);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow); transition: background 0.1s;
  }
  .ctrl-btn:hover { background: var(--surface2); color: var(--unt-green); }

  .compass {
    position: absolute; bottom: 120px; right: 20px;
    width: 36px; height: 36px; background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: 50%;
    box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: var(--unt-green-dark);
  }

  /* Info panel */
  .info-panel {
    position: absolute; top: 16px; right: 16px;
    width: 280px; background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    display: none; overflow: hidden;
    animation: slideIn 0.2s ease;
  }
  .info-panel.visible { display: block; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .info-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 10px;
  }
  .info-icon {
    width: 36px; height: 36px; border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 18px;
  }
  .info-header-text h2 { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .info-header-text .cat-badge {
    display: inline-block; margin-top: 4px;
    font-size: 11px; font-weight: 500; padding: 2px 8px;
    border-radius: 20px;
  }
  .info-body { padding: 12px 16px 14px; }
  .info-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
  .info-row:last-child { margin-bottom: 0; }
  .info-label { font-size: 11px; font-weight: 500; color: var(--text-hint); min-width: 56px; padding-top: 2px; text-transform: uppercase; letter-spacing: 0.03em; }
  .info-val { font-size: 13px; color: var(--text); line-height: 1.45; }
  .close-btn {
    position: absolute; top: 10px; right: 10px;
    width: 22px; height: 22px; border-radius: 50%; border: none;
    background: var(--surface2); color: var(--text-muted); font-size: 14px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .close-btn:hover { background: var(--border-strong); }

  /* Legend */
  .legend {
    position: absolute; bottom: 16px; left: 16px;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); padding: 10px 14px;
    box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 5px;
  }
  .legend-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-hint); margin-bottom: 3px; }
  .legend-row { display: flex; align-items: center; gap: 7px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-label { font-size: 12px; color: var(--text-muted); }

  /* ── Map road/path styles (SVG) ── */
  .road { fill: none; stroke: #C8C8BC; stroke-width: 4; stroke-linecap: round; }
  .road-minor { fill: none; stroke: #D8D8CC; stroke-width: 2; stroke-linecap: round; }
  .path-walk { fill: none; stroke: #BEC9BA; stroke-width: 1.5; stroke-dasharray: 4 3; stroke-linecap: round; }
  .grass { fill: #C8D9B8; }
  .water { fill: #A8C8D8; }
  .parking { fill: #D0CCC0; stroke: none; }
  .building-shape { stroke: none; }
  .pin { cursor: pointer; transition: transform 0.15s; transform-origin: center; }
  .pin:hover { transform: scale(1.2); }
  .pin.selected circle.outer { stroke-width: 2.5; }

  .map-label { font-family: 'DM Mono', monospace; font-size: 9px; fill: #5A6650; pointer-events: none; }
  .street-label { font-family: 'DM Mono', monospace; font-size: 8px; fill: #888880; pointer-events: none; }

  .scale-bar {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 4px; padding: 5px 10px;
    font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-muted);
    box-shadow: var(--shadow);
  }
</style>
</head>
<body>

<header>
  <div class="logo-eagle">🦅</div>
  <h1>UNT Campus Map — Denton</h1>

<div class="app-body">

      <!-- Hickory St (horizontal top) -->

      <!-- Mulberry St -->
      <line x1="0" y1="260" x2="900" y2="260" class="road"/>

      <line x1="600" y1="0" x2="600" y2="700" class="road-minor"/>
      <line x1="0" y1="80" x2="900" y2="80" class="road-minor"/>
      <line x1="0" y1="470" x2="900" y2="470" class="road-minor"/>

      <!-- Walking paths -->

      <line x1="450" y1="310" x2="600" y2="350" class="path-walk"/>
      <line x1="310" y1="400" x2="450" y2="390" class="path-walk"/>

      <!-- Kerr Hall -->

      <div class="legend-row"><div class="legend-dot" style="background:#1D9E75"></div><span class="legend-label">Academic</span></div>

      <div class="legend-row"><div class="legend-dot" style="background:#D44A6A"></div><span class="legend-label">Recreation</span></div>

<script>

/* Build sidebar list */
const bldList = document.getElementById('bldList');
const noResults = document.getElementById('noResults');

function buildList(filter = 'all', query = '') {
  let count = 0;
  bldList.querySelectorAll('.bld-item').forEach(el => {
    const b = BUILDINGS.find(x => x.id === el.dataset.id);
    const catMatch = filter === 'all' || b.cat === filter;
    const qMatch = !query || b.name.toLowerCase().includes(query) || b.cat.includes(query) || b.code.toLowerCase().includes(query);
    const visible = catMatch && qMatch;
    el.classList.toggle('hidden', !visible);
    if (visible) count++;
  });
  noResults.style.display = count === 0 ? 'block' : 'none';
}

BUILDINGS.forEach(b => {
  const c = CAT_COLORS[b.cat];
  const el = document.createElement('div');
  el.className = 'bld-item';
  el.dataset.id = b.id;
  el.innerHTML = `
    <div class="bld-dot" style="background:${c.dot}"></div>
    <div class="bld-info">
      <h3>${b.name}</h3>
      <p>${b.cat.charAt(0).toUpperCase()+b.cat.slice(1)} · ${b.code}</p>
    </div>`;
  el.addEventListener('click', () => selectBuilding(b.id));
  bldList.appendChild(el);
});

/* Render SVG pins */
const pinsLayer = document.getElementById('pins-layer');

BUILDINGS.forEach(b => {
  const c = CAT_COLORS[b.cat];
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'pin');
  g.setAttribute('data-id', b.id);
  g.innerHTML = `
    <circle class="outer" cx="${b.x}" cy="${b.y}" r="9" fill="${c.dot}" opacity="0.25"/>
    <circle cx="${b.x}" cy="${b.y}" r="6" fill="${c.dot}" filter="url(#pin-shadow)"/>
    <circle cx="${b.x}" cy="${b.y}" r="2.5" fill="white"/>`;
  g.addEventListener('click', () => selectBuilding(b.id));
  pinsLayer.appendChild(g);
});

/* Select building */
let selected = null;

function selectBuilding(id) {
  selected = id;
  const b = BUILDINGS.find(x => x.id === id);
  const c = CAT_COLORS[b.cat];

  // Sidebar highlight
  document.querySelectorAll('.bld-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  const item = bldList.querySelector(`[data-id="${id}"]`);
  if (item) item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  // Pin highlight
  document.querySelectorAll('.pin').forEach(p => {
    const sel = p.dataset.id === id;
    const outer = p.querySelector('.outer');
    if (outer) { outer.setAttribute('r', sel ? '13' : '9'); outer.setAttribute('opacity', sel ? '0.35' : '0.25'); }
  });

  // Info panel
  document.getElementById('infoIcon').textContent = CAT_ICONS[b.cat];
  document.getElementById('infoIcon').style.background = c.bg;
  document.getElementById('infoName').textContent = b.name;
  const badge = document.getElementById('infoBadge');
  badge.textContent = b.cat.charAt(0).toUpperCase() + b.cat.slice(1);
  badge.style.background = c.bg;
  badge.style.color = c.text;
  document.getElementById('infoHours').textContent = b.hours;
  document.getElementById('infoDesc').textContent = b.desc;
  document.getElementById('infoCodes').textContent = b.code;
  document.getElementById('infoPanel').classList.add('visible');
}

document.getElementById('closePanel').addEventListener('click', () => {
  document.getElementById('infoPanel').classList.remove('visible');
  document.querySelectorAll('.bld-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.pin').forEach(p => {
    const outer = p.querySelector('.outer');
    if (outer) { outer.setAttribute('r', '9'); outer.setAttribute('opacity', '0.25'); }
  });
  selected = null;
});

/* Search & filter */
let activeCat = 'all';
document.getElementById('search').addEventListener('input', e => buildList(activeCat, e.target.value.toLowerCase().trim()));
document.getElementById('filters').addEventListener('click', e => {
  if (!e.target.matches('.filter-btn')) return;
  activeCat = e.target.dataset.cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === activeCat));
  buildList(activeCat, document.getElementById('search').value.toLowerCase().trim());
});

/* Pan & Zoom */
const svg = document.getElementById('map-svg');
let vb = { x: 0, y: 0, w: 900, h: 700 };
let dragging = false, startX, startY, startVb;

function applyVB() { svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }

svg.addEventListener('mousedown', e => {
  dragging = true; startX = e.clientX; startY = e.clientY;
  startVb = {...vb};
});
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = (e.clientX - startX) * (vb.w / svg.clientWidth);
  const dy = (e.clientY - startY) * (vb.h / svg.clientHeight);
  vb.x = startVb.x - dx; vb.y = startVb.y - dy; applyVB();
});

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 1.1 : 0.9;
  const rect = svg.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width * vb.w + vb.x;
  const my = (e.clientY - rect.top) / rect.height * vb.h + vb.y;
  vb.w *= factor; vb.h *= factor;
  vb.x = mx - (e.clientX - rect.left) / rect.width * vb.w;
  vb.y = my - (e.clientY - rect.top) / rect.height * vb.h;
  applyVB();
}, { passive: false });

document.getElementById('zoomIn').addEventListener('click', () => {
  vb.x += vb.w*0.1; vb.y += vb.h*0.1; vb.w *= 0.8; vb.h *= 0.8; applyVB();
});
document.getElementById('zoomOut').addEventListener('click', () => {
  vb.x -= vb.w*0.125; vb.y -= vb.h*0.125; vb.w *= 1.25; vb.h *= 1.25; applyVB();
});
document.getElementById('resetView').addEventListener('click', () => {
  vb = { x: 0, y: 0, w: 900, h: 700 }; applyVB();
});

// Touch support
let lastTouchDist = null;
svg.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    dragging = true; startX = e.touches[0].clientX; startY = e.touches[0].clientY; startVb = {...vb};
  } else if (e.touches.length === 2) {
    lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  }
}, { passive: true });
svg.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && dragging) {
    const dx = (e.touches[0].clientX - startX) * (vb.w / svg.clientWidth);
    const dy = (e.touches[0].clientY - startY) * (vb.h / svg.clientHeight);
    vb.x = startVb.x - dx; vb.y = startVb.y - dy; applyVB();
  } else if (e.touches.length === 2 && lastTouchDist) {
    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const factor = lastTouchDist / dist;
    vb.w *= factor; vb.h *= factor; lastTouchDist = dist; applyVB();
  }
}, { passive: true });
svg.addEventListener('touchend', () => { dragging = false; lastTouchDist = null; });
</script>
